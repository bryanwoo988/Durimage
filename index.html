  <script>
    // Apply the saved theme before first paint (no light flash in dark mode).
    (function () {
      try {
        var g = function (k, d) { var v = localStorage.getItem('dm_' + k); return v ? JSON.parse(v) : d; };
        var mode = g('appearance', 'system');
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? g('darkTheme', 'midnight') : g('lightTheme', 'paper');
        document.documentElement.dataset.dark = dark ? '1' : '';
        // Real window height: on iPhone home-screen apps 100vh/100dvh can be taller than the
        // window (it includes the status bar), which made pages scroll and showed a band at the bottom.
        document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
      } catch (e) {}
    })();

    <header class="topbar">

        <img class="brand-mark" src="icons/mark.svg" alt="">

          <div class="brand-tag" id="brandTag"></div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="settingsBtn" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
      </div>
    </header>

    <main class="content">
      <div class="banner banner-demo" id="demoBanner" hidden data-i18n="demoBanner"></div>
      <div class="banner banner-offline" id="offlineBanner" hidden>
        <svg><use href="#i-offline"/></svg><span data-i18n="offline"></span>
      </div>
      <section class="card upbar" id="uploadBar" hidden>
        <div class="upbar-top">
          <svg><use href="#i-cloud"/></svg>
          <span id="uploadText"></span>
          <button class="btn btn-small btn-primary" id="uploadAllBtn" data-i18n="uploadAll"></button>
        </div>
        <div class="upbar-track"><i id="uploadFill"></i></div>
        <div class="upbar-hint" id="uploadHint" data-i18n="keepOpen"></div>
      </section>

      <button class="card dest-card" id="destCard">
        <div class="dest-icon"><svg><use href="#i-folder-fill"/></svg></div>
        <div class="dest-text">
          <div class="dest-label" data-i18n="saveTo"></div>
          <div class="dest-name" id="destName"></div>
        </div>
        <svg class="chev"><use href="#i-chev"/></svg>
      </button>

      <section class="card tree-card" id="treeCard" hidden>
        <button class="tree-cell" id="orchardBtn">
          <div class="dest-label"><svg><use href="#i-flag"/></svg><span data-i18n="orchard"></span></div>
          <div class="tree-val" id="orchardValue"></div>
        </button>
        <button class="tree-cell" id="treeBtn">
          <div class="dest-label"><svg><use href="#i-tree"/></svg><span id="treeLabel"></span></div>
          <div class="tree-val" id="treeValue"></div>
        </button>

      </div>
      <div class="detail-img rev-img" id="rvImgBox"><img id="rvImg" alt=""><svg class="marks-svg" id="rvSvg"></svg><span class="zoom-badge"><svg><use href="#i-zoom"/></svg></span><div class="rv-loading" id="rvLoading"></div></div>
      <button class="btn btn-outline btn-block rv-draw" id="rvDraw"><svg><use href="#i-pen"/></svg><span id="rvDrawText"></span></button>
      <dl class="detail-list" id="rvInfo"></dl>
      <div class="rv-sub" id="rvSubmitter"></div>
      <div class="rv-others" id="rvOthers"></div>
      <div class="rv-form" id="rvForm">
        <div class="set-sub" data-i18n="yourReview"></div>
        <div class="rv-prev" id="rvPrev" hidden></div>
        <div class="segmented seg2 rv-verdict" id="rvVerdict"></div>
        <div class="judge" id="rvJudge"></div>
        <label class="field"><span data-i18n="comment"></span><textarea id="rvComment" rows="3" data-i18n-ph="commentPh"></textarea></label>
        <div class="sheet-foot">
          <button class="btn btn-ghost" data-close data-i18n="cancel"></button>
          <button class="btn btn-primary" id="rvSubmit" data-i18n="submitReview"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Categories (admin) -->
  <div class="sheet-backdrop" id="catSheet" hidden>
    <div class="sheet sheet-tall" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <h2 data-i18n="catManage"></h2>
        <button class="icon-btn" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="chip-row" id="catList"></div>
      <div class="set-sub" data-i18n="catAdd"></div>
      <input class="text-input plain" id="catZh" maxlength="40" data-i18n-ph="catZhPh">
      <input class="text-input plain" id="catEn" maxlength="40" data-i18n-ph="catEnPh">
      <input class="text-input plain" id="catMs" maxlength="40" data-i18n-ph="catMsPh">
      <button class="btn btn-primary btn-block" id="catAddBtn" data-i18n="catAdd"></button>
      <div class="set-sub" id="catSuggestTitle" data-i18n="catSuggest"></div>
      <div class="chip-row" id="catSuggest"></div>
    </div>
  </div>

  <!-- Drawing marks on a photo (reviewer) -->
  <div class="mark-ed" id="markEd" hidden>
    <div class="me-stage" id="meStage"><div class="z-layer" id="meLayer"><img id="meImg" alt="" draggable="false"><svg class="marks-svg" id="meSvg"></svg></div></div>
    <div class="me-top">
      <button class="me-btn" id="meCancel" data-i18n="cancel"></button>
      <div class="segmented seg2 me-mode" id="meMode">
        <button type="button" data-m="move"><svg><use href="#i-hand"/></svg><span data-i18n="meMove"></span></button>
        <button type="button" data-m="draw"><svg><use href="#i-pen"/></svg><span data-i18n="meDraw"></span></button>
      </div>
      <button class="me-btn me-done" id="meDone" data-i18n="meDone"></button>
    </div>
    <div class="me-bottom">
      <div class="me-cats" id="meCats"></div>
      <div class="me-tools">
        <div class="me-group" id="meTools">
          <button type="button" data-t="pen" aria-label="pen"><svg><use href="#i-pen"/></svg></button>
          <button type="button" data-t="ellipse" aria-label="circle"><svg><use href="#i-ellipse"/></svg></button>
          <button type="button" data-t="rect" aria-label="box"><svg><use href="#i-rect"/></svg></button>
          <button type="button" data-t="arrow" aria-label="arrow"><svg><use href="#i-arrow"/></svg></button>
        </div>
        <div class="me-group" id="meWidths">
          <button type="button" data-w="1"><i class="dot d1"></i></button>
          <button type="button" data-w="2"><i class="dot d2"></i></button>
          <button type="button" data-w="3"><i class="dot d3"></i></button>
        </div>
        <label class="me-color" aria-label="colour"><input type="color" id="meColor"><i id="meColorDot"></i></label>
        <div class="me-group">
          <button type="button" id="meUndo" aria-label="undo"><svg><use href="#i-undo"/></svg></button>
          <button type="button" id="meRedo" aria-label="redo"><svg><use href="#i-redo"/></svg></button>
          <button type="button" id="meClear" aria-label="clear"><svg><use href="#i-trash"/></svg></button>
          <button type="button" id="meToggle" aria-label="show/hide"><svg><use href="#i-eye2"/></svg></button>
        </div>
      </div>
      <div class="me-list" id="meList"></div>
    </div>
  </div>

  <!-- Full-screen photo viewer: pinch / double-tap to zoom, drag to pan -->
  <div class="viewer" id="viewer" hidden>
    <div class="viewer-stage" id="viewerStage"><div class="z-layer" id="viewerLayer"><img id="viewerImg" alt="" draggable="false"><svg class="marks-svg" id="viewerSvg"></svg></div></div>
    <button class="viewer-close" id="viewerClose" aria-label="Close"><svg><use href="#i-x"/></svg></button>
    <div class="viewer-hint" id="viewerHint" data-i18n="zoomHint"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="config.js"></script>
  <script src="changelog.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
