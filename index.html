<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Durimage</title>
  <meta name="description" content="Durian pest & disease photo capture to Google Drive">
  <meta name="theme-color" content="#2e1a63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Durimage">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint (no light flash in dark mode).
    (function () {
      try {
        var g = function (k, d) { var v = localStorage.getItem('dm_' + k); return v ? JSON.parse(v) : d; };
        var mode = g('appearance', 'system');
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? g('darkTheme', 'midnight') : g('lightTheme', 'paper');
        document.documentElement.dataset.dark = dark ? '1' : '';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-camera" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.3-1.9A1.5 1.5 0 0 1 10.6 3.5h2.8a1.5 1.5 0 0 1 1.2.6L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.7" fill="currentColor"/><path d="m4.5 17 4.6-4.6a1.5 1.5 0 0 1 2.1 0L14 15.2l1.6-1.6a1.5 1.5 0 0 1 2.1 0l2.3 2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3.6a2 2 0 0 1 1.5.7l1.2 1.3h6.7a2 2 0 0 1 2 2v7.9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-folder-fill" viewBox="0 0 24 24"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3.6a2 2 0 0 1 1.5.7l1.2 1.3h6.7a2 2 0 0 1 2 2v7.9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.5 1.6A3.8 3.8 0 0 1 17.3 18.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 15.5v-5m0 0-2.2 2.2M12 10.5l2.2 2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-offline" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 8.6A6 6 0 0 0 6.4 9.5 4.5 4.5 0 0 0 7 18.5h10.3M17.9 11.1a6 6 0 0 0-7.6-4.9M20.3 16.6a3.8 3.8 0 0 0-2.4-5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-google" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.5"/></g><g fill="currentColor"><rect x="5.9" y="5.9" width="1.7" height="1.7"/><rect x="16.4" y="5.9" width="1.7" height="1.7"/><rect x="5.9" y="16.4" width="1.7" height="1.7"/><rect x="14" y="14" width="2.6" height="2.6" rx=".5"/><rect x="17.9" y="17.9" width="2.6" height="2.6" rx=".5"/><rect x="17.9" y="14" width="2.6" height="2.6" rx=".5"/><rect x="14" y="17.9" width="2.6" height="2.6" rx=".5"/></g></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5m0 0L8 7.5m4-4 4 4M6 11H5.5A1.5 1.5 0 0 0 4 12.5v6A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5v-6a1.5 1.5 0 0 0-1.5-1.5H18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 12h17M12 3.5c2.6 2.6 3.8 5.4 3.8 8.5s-1.2 5.9-3.8 8.5c-2.6-2.6-3.8-5.4-3.8-8.5S9.4 6.1 12 3.5z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6.5 3.5h7.6l4.4 4.4v10.6a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3.7V8h4.3M8 12.5h8M8 16h5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-logo" viewBox="0 0 64 64"><g fill="currentColor"><path d="M32 4l4 7 7-4 1 8 8-1-2 8 7 3-5 6 5 6-7 3 2 8-8-1-1 8-7-4-4 7-4-7-7 4-1-8-8 1 2-8-7-3 5-6-5-6 7-3-2-8 8 1 1-8 7 4z"/></g><ellipse cx="32" cy="34" rx="11" ry="12" fill="#fbbf24"/><path d="M32 22c-1-4 1-8 5-10" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/></symbol>
  </svg>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icons/mark.svg" alt="">
        <div>
          <div class="brand-name">Durimage</div>
          <div class="brand-tag" data-i18n="tagline"></div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="settingsBtn" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
      </div>
    </header>

    <main class="content">
      <div class="banner banner-demo" id="demoBanner" hidden data-i18n="demoBanner"></div>
      <div class="banner banner-offline" id="offlineBanner" hidden>
        <svg><use href="#i-offline"/></svg><span data-i18n="offline"></span>
      </div>
      <section class="card upbar" id="uploadBar" hidden>
        <div class="upbar-top">
          <svg><use href="#i-cloud"/></svg>
          <span id="uploadText"></span>
          <button class="btn btn-small btn-primary" id="uploadAllBtn" data-i18n="uploadAll"></button>
        </div>
        <div class="upbar-track"><i id="uploadFill"></i></div>
        <div class="upbar-hint" id="uploadHint" data-i18n="keepOpen"></div>
      </section>

      <button class="card dest-card" id="destCard">
        <div class="dest-icon"><svg><use href="#i-folder-fill"/></svg></div>
        <div class="dest-text">
          <div class="dest-label" data-i18n="saveTo"></div>
          <div class="dest-name" id="destName"></div>
        </div>
        <svg class="chev"><use href="#i-chev"/></svg>
      </button>

      <section class="stats">
        <div class="stat"><div class="stat-num" id="statToday">0</div><div class="stat-label" data-i18n="statToday"></div></div>
        <div class="stat stat-pending"><div class="stat-num" id="statPending">0</div><div class="stat-label" data-i18n="statPending"></div></div>
        <div class="stat stat-done"><div class="stat-num" id="statDone">0</div><div class="stat-label" data-i18n="statDone"></div></div>
      </section>

      <section>
        <h3 class="section-title" data-i18n="recent"></h3>
        <div class="grid" id="recentGrid"></div>
        <div class="empty" id="emptyState">
          <div class="empty-art"><img src="icons/mark.svg" alt=""></div>
          <div class="empty-title" data-i18n="emptyTitle"></div>
          <p data-i18n="emptyDesc"></p>
        </div>
      </section>
    </main>

    <nav class="dock">
      <label class="dock-btn">
        <input type="file" accept="image/*" multiple id="galleryInput" hidden>
        <svg><use href="#i-image"/></svg><span data-i18n="gallery"></span>
      </label>
      <label class="shutter" aria-label="Capture">
        <input type="file" accept="image/*" capture="environment" id="cameraInput" hidden>
        <span class="shutter-ring"><span class="shutter-core"><svg><use href="#i-camera"/></svg></span></span>
      </label>
      <button class="dock-btn" id="foldersBtn"><svg><use href="#i-folder"/></svg><span data-i18n="folders"></span></button>
    </nav>
  </div>

  <!-- Review sheet (after capture) -->
  <div class="sheet-backdrop" id="reviewSheet" hidden>
    <div class="sheet sheet-tall" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <h2 data-i18n="reviewTitle"></h2>
        <button class="icon-btn" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="review-strip" id="reviewStrip"></div>
      <div class="review-count" id="reviewCount"></div>
      <h3 class="section-title" data-i18n="chooseFolder"></h3>
      <div class="folder-chips" id="reviewFolders"></div>
      <label class="field">
        <span data-i18n="note"></span>
        <textarea id="noteInput" rows="3" data-i18n-ph="notePh"></textarea>
        <small class="field-hint"><svg><use href="#i-note"/></svg><span data-i18n="noteHint"></span></small>
      </label>
      <div class="gps-line" id="gpsLine" hidden><svg><use href="#i-pin"/></svg><span id="gpsText"></span></div>
      <div class="sheet-foot">
        <button class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button class="btn btn-primary" id="saveBtn"></button>
      </div>
    </div>
  </div>

  <!-- Folder sheet -->
  <div class="sheet-backdrop" id="folderSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <h2 data-i18n="foldersTitle"></h2>
        <button class="icon-btn" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <p class="hint" data-i18n="foldersHint"></p>
      <ul class="folder-list" id="folderList"></ul>
      <button class="btn btn-outline btn-block" id="refreshFoldersBtn"><svg><use href="#i-retry"/></svg><span data-i18n="refresh"></span></button>
    </div>
  </div>

  <!-- Settings sheet -->
  <div class="sheet-backdrop" id="settingsSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <h2 data-i18n="settings"></h2>
        <button class="icon-btn" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="set-group set-row">
        <div>
          <div class="set-label" data-i18n="language"></div>
          <div class="set-title" id="langName"></div>
        </div>
        <button class="btn btn-small btn-outline" id="langCycleBtn"><svg><use href="#i-globe"/></svg><span data-i18n="switchLang"></span></button>
      </div>
      <button class="set-group set-row set-link" id="appearRowBtn">
        <div>
          <div class="set-label" data-i18n="appearance"></div>
          <div class="set-title" id="appearValue"></div>
        </div>
        <svg class="chev"><use href="#i-chev"/></svg>
      </button>
      <div class="set-group set-row">
        <div>
          <div class="set-title" data-i18n="gps"></div>
          <div class="set-desc" data-i18n="gpsDesc"></div>
        </div>
        <label class="switch"><input type="checkbox" id="gpsToggle"><span></span></label>
      </div>
      <div class="set-group set-row">
        <div>
          <div class="set-label" data-i18n="yourName"></div>
          <div class="set-title" id="nameValue"></div>
        </div>
        <button class="btn btn-small btn-outline" id="editNameBtn" data-i18n="edit"></button>
      </div>
      <div class="set-group set-row">
        <div>
          <div class="set-label" data-i18n="teamPw"></div>
          <div class="set-title">••••••</div>
        </div>
        <button class="btn btn-small btn-outline" id="reenterPwBtn" data-i18n="reenterPw"></button>
      </div>
      <button class="btn btn-outline btn-block share-row" id="shareRowBtn"><svg><use href="#i-qr"/></svg><span data-i18n="shareApp"></span></button>
      <button class="btn btn-ghost btn-block" id="clearHistoryBtn" data-i18n="clearHistory"></button>
      <div class="version">Durimage v1.3</div>
    </div>
  </div>

  <!-- Photo detail sheet -->
  <div class="sheet-backdrop" id="detailSheet" hidden>
    <div class="sheet sheet-tall" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <h2 data-i18n="detailTitle"></h2>
        <button class="icon-btn" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="detail-img"><img id="detailImg" alt=""><span id="detailBadge"></span></div>
      <div class="detail-err" id="detailErr" hidden></div>
      <dl class="detail-list" id="detailList"></dl>
      <div class="sheet-foot detail-foot" id="detailFoot">
        <button class="btn btn-ghost" id="detailDelete" data-i18n="deleteFromPhone"></button>
        <button class="btn btn-primary" id="detailRetry" data-i18n="retry"></button>
      </div>
    </div>
  </div>

  <!-- Appearance sheet -->
  <div class="sheet-backdrop" id="appearSheet" hidden>
    <div class="sheet appear-sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <h2 class="appear-title" data-i18n="appearance"></h2>
        <button class="icon-btn" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="segmented appear-seg" id="modeSeg"></div>
      <p class="appear-desc" data-i18n="appearanceDesc"></p>
      <h3 class="appear-sub" data-i18n="lightTheme"></h3>
      <div class="swatches" id="lightSwatches"></div>
      <h3 class="appear-sub" data-i18n="darkTheme"></h3>
      <div class="swatches" id="darkSwatches"></div>
    </div>
  </div>

  <!-- Share sheet -->
  <div class="sheet-backdrop" id="shareSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <h2 data-i18n="shareApp"></h2>
        <button class="icon-btn" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <p class="hint" data-i18n="shareDesc"></p>
      <div class="qr-card">
        <div class="qr-box" id="qrBox"></div>
        <div class="qr-brand"><img src="icons/icon.svg" alt=""><span>Durimage</span></div>
        <div class="qr-url" id="shareUrl"></div>
      </div>
      <div class="share-note" data-i18n="shareNote"></div>
      <div class="share-actions">
        <button class="btn btn-outline" id="copyLinkBtn"><svg><use href="#i-copy"/></svg><span data-i18n="copyLink"></span></button>
        <button class="btn btn-primary" id="nativeShareBtn"><svg><use href="#i-share"/></svg><span data-i18n="shareVia"></span></button>
      </div>
    </div>
  </div>

  <!-- Onboarding: step 1 team password, step 2 name. Form sits at the bottom (thumb zone). -->
  <div class="onboard" id="onboard" hidden>
    <div class="onboard-inner">
      <div class="onboard-hero">
        <img class="onboard-logo" src="icons/icon.svg" alt="">
        <div class="ob-welcome" data-i18n="welcomeTo"></div>
        <h1 class="ob-title">Durimage</h1>
        <p class="ob-sub" data-i18n="featuresIntro"></p>
        <ul class="ob-features">
          <li><span class="ob-ic"><svg><use href="#i-camera"/></svg></span><span data-i18n="feat1"></span></li>
          <li><span class="ob-ic"><svg><use href="#i-folder"/></svg></span><span data-i18n="feat2"></span></li>
          <li><span class="ob-ic"><svg><use href="#i-note"/></svg></span><span data-i18n="feat3"></span></li>
          <li><span class="ob-ic"><svg><use href="#i-offline"/></svg></span><span data-i18n="feat4"></span></li>
        </ul>
      </div>
      <div class="ob-panel">
        <form id="pwForm" novalidate>
          <div class="ob-step" id="pwStep"></div>
          <div class="onboard-notice" id="pwNotice" hidden data-i18n="pwChanged"></div>
          <input class="ob-input" id="pwInput" type="password" autocomplete="current-password" data-i18n-ph="pwPh">
          <div class="ob-help" data-i18n="pwDesc"></div>
          <div class="form-err" id="pwErr"></div>
          <button class="ob-btn" id="pwSubmit" type="submit" data-i18n="next"></button>
          <button class="ob-ghost" id="pwCancel" type="button" data-i18n="cancel" hidden></button>
        </form>
        <form id="nameForm" novalidate hidden>
          <div class="ob-step" id="nameStep"></div>
          <input class="ob-input" id="nameInput" type="text" autocomplete="name" maxlength="40" data-i18n-ph="namePh">
          <div class="ob-help" data-i18n="nameDesc"></div>
          <div class="form-err"></div>
          <button class="ob-btn" id="nameSubmit" type="submit" data-i18n="start"></button>
          <button class="ob-ghost" id="nameCancel" type="button" data-i18n="cancel" hidden></button>
        </form>
        <button class="ob-lang" id="onboardLangBtn" type="button"><span data-i18n="switchLangQ"></span> <b id="onboardLangLabel"></b></button>
      </div>
    </div>
