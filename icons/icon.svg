  <path d="M110 190 q3 14 17 17 q-14 3 -17 17 q-3 -14 -17 -17 q14 -3 17 -17z" fill="#ffd35a"/>
  <path d="M430 246 q2 10 12 12 q-10 2 -12 12 q-2 -10 -12 -12 q10 -2 12 -12z" fill="#fff0c4"/>
</g>
