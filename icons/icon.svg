  <path d="M256 289 l7 14 15 2 -11 10 3 15 -14 -7 -14 7 3 -15 -11 -10 15 -2 z" fill="#fff8e1" stroke="#b9780a" stroke-width="2.5" stroke-linejoin="round"/>

