  <ellipse cx="200" cy="392" rx="14" ry="8" fill="#ee8f74" opacity=".55"/><ellipse cx="312" cy="392" rx="14" ry="8" fill="#ee8f74" opacity=".55"/>
  <path d="M208 382 q13 -14 26 0" stroke="#3a2a1a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M278 382 q13 -14 26 0" stroke="#3a2a1a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- beard (durian flesh) -->
  <path d="M168 380 C168 420 190 452 214 466 C222 486 240 496 256 500 C272 496 290 486 298 466 C322 452 344 420 344 380
           C330 396 312 404 296 400 C284 412 268 416 256 410 C244 416 228 412 216 400 C200 404 182 396 168 380 Z" fill="url(#beard)"/>
  <path d="M214 466 C226 450 236 440 236 420 M298 466 C286 450 276 440 276 420 M256 500 C252 480 252 456 256 430" stroke="#e8c070" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
  <!-- mustache -->
  <path d="M256 398 C240 386 214 386 200 402 C214 404 230 410 256 404 C282 410 298 404 312 402 C298 386 272 386 256 398 Z" fill="#fff0c4"/>
  <circle cx="256" cy="390" r="15" fill="#ee9b72"/>
  <circle cx="251" cy="385" r="4.5" fill="#fff" opacity=".6"/>

  <!-- brim -->
  <ellipse cx="256" cy="336" rx="182" ry="38" fill="url(#brim)"/>
  <ellipse cx="256" cy="330" rx="170" ry="28" fill="#5e9a2a" opacity=".55"/>

  <!-- hat -->
  <path id="hat" d="M150 334 C172 246 204 162 262 104 C286 80 322 62 360 62 C342 78 326 98 318 124 C302 186 330 258 364 334 Z" fill="url(#thorns)"/>
  <path d="M150 334 C172 246 204 162 262 104 C286 80 322 62 360 62 C342 78 326 98 318 124 C302 186 330 258 364 334 Z" fill="url(#hatShade)"/>
  <path d="M150 334 C172 246 204 162 262 104 C286 80 322 62 360 62 C342 78 326 98 318 124 C302 186 330 258 364 334 Z" fill="none" stroke="#24470e" stroke-width="5" stroke-linejoin="round"/>
