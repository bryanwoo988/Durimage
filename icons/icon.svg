<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".28" r=".9">
      <stop offset="0" stop-color="#5b3aa6"/><stop offset=".55" stop-color="#2e1a63"/><stop offset="1" stop-color="#160c33"/>
    </radialGradient>
    <pattern id="thorns" width="44" height="38" patternUnits="userSpaceOnUse" patternTransform="rotate(-10)">
      <rect width="44" height="38" fill="#3f6a17"/>
      <g id="d">
        <polygon points="22,2 42,19 22,36 2,19" fill="#8db32c"/>
        <polygon points="22,2 2,19 22,19" fill="#c3dc55"/>
        <polygon points="22,19 42,19 22,36" fill="#5d8a1f"/>
      </g>
      <use href="#d" x="-22" y="-19"/><use href="#d" x="22" y="-19"/>
      <use href="#d" x="-22" y="19"/><use href="#d" x="22" y="19"/>
    </pattern>
    <linearGradient id="hatShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".65" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b2610" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd35a"/><stop offset="1" stop-color="#e09a12"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8a22"/><stop offset="1" stop-color="#244d10"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6dc"/><stop offset="1" stop-color="#f4d58c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/><circle cx="70" cy="80" r="3" fill="#fff" opacity="0.7"/><circle cx="150" cy="60" r="2" fill="#fff" opacity="0.5"/><circle cx="460" cy="70" r="2.5" fill="#fff" opacity="0.6"/><circle cx="470" cy="330" r="2" fill="#fff" opacity="0.5"/><circle cx="50" cy="300" r="2.5" fill="#fff" opacity="0.5"/><circle cx="90" cy="430" r="2" fill="#fff" opacity="0.4"/><circle cx="440" cy="440" r="3" fill="#fff" opacity="0.5"/><circle cx="380" cy="40" r="2" fill="#fff" opacity="0.6"/>
  <g transform="translate(256 262) scale(.8) translate(-256 -266)">

  <!-- face -->
